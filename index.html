<!DOCTYPE html> <!--erve para identificar a linguagem de programação que esta sendo ultilizada.-->
<html lang="en"> <!--abertura do documento, delimita o espaço de codificação. todas as tag devem ser colocadas nesse espaço.-->
<head> <!--tag que define o cabeçalho do documento. tudo o que foi escrito dentro dessa tag não aparecera na pagina principal. dentro dessa tag, pode ser inserida folhas de estilos e script.-->
    <meta charset="UTF-8"> <!-- especifica qual o conjuntode caracteres (character ser ou charset), será usado para renderizar o texto da pagina.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--fornece os metadados sobre a sua pagina-->
    <title>portfólio</title> <!--título da página-->
</head> <!--fechamento do cabeçalho-->
<body> <!-- nesse espaço está contido o contrúdo visual da página. As tags que representam texto, botões e outros, devem ser adicionados nesse intervalo.-->
<!--um documento HTML é composto por tags que são escritas entre < >. As tags precisam ser abertas e fechadas, o que as diferenciam é que tags de fechamento possuem uma \ antes do nome. Alguns códigos não precisam da <\> para fechamento, apenas da da barra, ou nem isso, como no caso da tag meta. Outro aspecto importante é que ela é case insensitive, ou seja, não leva em consideração a diferença entre letras oficiais e minúsculas. < -->   

<h1>Matematica</h1>

</body>
</html> <!--fechamento da tag, documento.-->
